[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Перенаправление для Decap CMS (чтобы /admin работал)
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

# Включаем Identity для Decap CMS (нужно для входа в админку)
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
